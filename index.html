<title>Premium Refurbished iPhones</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0f0f10;
color:white;
}

/* HEADER */

header{
text-align:center;
padding:25px;
border-bottom:1px solid #222;
}

/* HERO */

.hero{
text-align:center;
padding:80px 20px;
}

.hero h2{
font-size:40px;
}

/* PRODUCTS */

.products{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
padding:40px 80px;

}

/* CARD */

.card{

background:#1a1a1d;
border-radius:15px;
padding:18px;
box-shadow:0 20px 40px rgba(0,0,0,0.6);
transition:0.35s;

}

.card:hover{

transform:translateY(-10px) scale(1.03);

}

.card img{

width:100%;
border-radius:10px;

}

.discount{

background:#ff3b30;
padding:5px 10px;
font-size:12px;
border-radius:6px;

}

.oldprice{

text-decoration:line-through;
color:#888;

}

.price{

color:#4cd964;
font-size:20px;
font-weight:600;

}

.advance{

color:#ffcc00;
font-size:13px;

}

.stock{

color:#ff9500;
font-size:13px;

}

.timer{

color:#00d1ff;
font-size:13px;

}

/* SCROLL ANIMATION */

.fade{

opacity:0;
transform:translateY(40px);
transition:all 0.8s ease;

}

.fade.show{

opacity:1;
transform:translateY(0);

}

footer{

text-align:center;
padding:25px;
border-top:1px solid #222;
color:#aaa;

}

</style>

</head>

const container=document.getElementById("productContainer")
products.forEach((p,i)=>{

<span class="discount">Limited Offer</span>

<img src="${p.image}">

<h3>${p.name}</h3>

<p class="oldprice">₹${p.oldPrice}</p>

<p class="advance">Advance to Order: ₹${p.advance}</p>

</div>

`;

/* TIMER */

const endTime=new Date("March 13, 2026 16:00:00").getTime();

function updateTimer(){

const now=new Date().getTime()

const distance=endTime-now

const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60))
const minutes=Math.floor((distance%(1000*60*60))/(1000*60))
const seconds=Math.floor((distance%(1000*60))/1000)

products.forEach((p,i)=>{

document.getElementById("timer"+i).innerHTML=
"Discount ends in "+hours+"h "+minutes+"m "+seconds+"s"

})

if(distance<0){

products.forEach((p,i)=>{

document.getElementById("price"+i).innerHTML="₹"+p.oldPrice

document.getElementById("timer"+i).style.display="none"

})

clearInterval(interval)

}

}

const interval=setInterval(updateTimer,1000)

/* SCROLL ANIMATION */

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("show")
}
})
})

document.querySelectorAll(".fade").forEach(el=>{
observer.observe(el)
})
